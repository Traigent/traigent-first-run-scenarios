name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, linting, typing and spelling run once, in their own job, on a
  # single declared interpreter. They are deliberately not steps of the version
  # matrix below. A step condition that no matrix leg satisfies is reported as
  # a skipped step, and a job whose steps were all skipped is reported as a
  # successful job, so a condition repeating a matrix value can retire every
  # gate here without turning a single run red.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check Python formatting
        run: black --check scenario.py scripts tests

      - name: Lint Python
        run: ruff check scenario.py scripts tests

      - name: Type-check production Python
        run: mypy --strict scenario.py scripts/check_public_surface.py

      # The spelling scope comes from the git index rather than a written-out
      # path list. A renamed or newly added file stays covered, where a stale
      # list entry was skipped without a warning and quietly shrank the gate.
      # Generated content is skipped by name, and every skip must still match a
      # tracked file so the list cannot outlive what it describes. Binary files
      # are skipped by codespell itself and need no entry here.
      - name: Check spelling
        run: |
          set -euo pipefail
          skipped_paths=(
            "presentation/package-lock.json"
          )
          exclusions=()
          for skipped_path in "${skipped_paths[@]}"; do
            if [ -z "$(git ls-files -- "${skipped_path}")" ]; then
              echo "spelling skip matches no tracked file: ${skipped_path}" >&2
              exit 1
            fi
            exclusions+=(":(exclude)${skipped_path}")
          done
          git ls-files -z -- . "${exclusions[@]}" |
            xargs -0 --no-run-if-empty codespell --

  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate published scenario bank
        run: python scenario.py check

      - name: Check public surface
        run: python scripts/check_public_surface.py

      # Every tracked Python file must parse, including the scenario sources
      # this repository ships into a customer project. The list is derived from
      # the git index because compileall reports an unreadable path on stdout
      # and still exits 0, so a written-out list could go stale unnoticed.
      # -f is required rather than tidy: compileall otherwise accepts a cached
      # .pyc whose recorded whole-second source timestamp still matches, so an
      # edit made inside that second is skipped without a word.
      # Parsing is a property every published file owes a customer; formatting,
      # lint rules and strict typing are this repository's house style and are
      # deliberately not imposed on customer-shaped scenario sources.
      - name: Compile Python sources
        run: |
          set -euo pipefail
          git ls-files -z -- '*.py' |
            xargs -0 --no-run-if-empty python -m compileall -q -f --

  presentation:
    name: Presentation artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: presentation

      - name: Audit presentation dependencies
        run: npm audit --audit-level=high
        working-directory: presentation

      - name: Validate and build presentation
        run: npm run check
        working-directory: presentation

      - name: Upload offline presentation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-run-presales-presentation
          path: presentation/dist/customer-bundle/
          if-no-files-found: error
          retention-days: 14
